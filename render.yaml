services:
  - type: web
    name: attendance-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    plan: free
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
