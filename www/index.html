<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSSS Attendance Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef6ff 50%, #f6f2ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .splash-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            max-width: 380px;
            width: 100%;
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #8EC5FC, #E0C3FC);
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        h2 { font-size: 1.35rem; color: #0f172a; margin-bottom: 8px; font-weight: 800; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="icon">📹</div>
        <h2>GSSS Attendance Portal</h2>
        <p>Connecting to attendance server...</p>
        <div class="spinner"></div>
    </div>
    <script>
        // Direct to portal server
        const targetUrl = "https://shoe-mechanism-reliability-joyce.trycloudflare.com";
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 500);
    </script>
</body>
</html>
